name: Build Rocky Linux 9 PHP 8.5 RPM

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf -y install https://rpms.remirepo.net/enterprise/remi-release-9.rpm
          dnf -y install \
            gcc \
            gzip \
            make \
            php85-php-cli \
            php85-php-devel \
            php85-php-common \
            redhat-rpm-config \
            rpm-build \
            tar
          /opt/remi/php85/root/usr/bin/php --version

      - name: Build RPM
        shell: bash
        run: |
          set -euxo pipefail

          version="$(sed -n 's/^Version:[[:space:]]*//p' packaging/rpm/php-radius.spec)"
          topdir="${PWD}/rpmbuild"
          mkdir -p "${topdir}"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

          tar \
            --create \
            --gzip \
            --file="${topdir}/SOURCES/radius-${version}.tar.gz" \
            --transform="s,^\\.,radius-${version}," \
            --exclude='./.git' \
            --exclude='./rpmbuild' \
            .
          cp packaging/rpm/php-radius.spec "${topdir}/SPECS/"

          rpmbuild -ba \
            --define "_topdir ${topdir}" \
            "${topdir}/SPECS/php-radius.spec"

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: php-radius-rocky-9-php85-rpm
          path: |
            rpmbuild/RPMS/**/*.rpm
            rpmbuild/SRPMS/*.src.rpm
          if-no-files-found: error
